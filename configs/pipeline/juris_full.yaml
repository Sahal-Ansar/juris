# Full Juris pipeline (IDEA_final §5 "P", §6; PLAN 7.12; juris.pipeline.system). The stages
# and parameters match the defaults in juris.config and are spelled out so the profile is
# explicit. Every role uses the settings' default model (set it in .env), like B0-B2.
name: juris_full
description: Full adversarial deliberation pipeline, S0-S10.
kind: juris
seed: 0
stages:
  s0_issue_framing: "on"
  s1_research: "on"
  s2_opening: "on"
  s3_precedent: "on"
  s4_verify: "on"
  s5_rebuttal: "on"
  s6_cross_exam: "on"
  s7_verify: "on"
  s8_jury: "on"
  s9_judge: "on"
  s10_final_verify: "on"
params:
  max_issues: 4
  positions_per_issue: 2
  evidence_per_issue_min: 10
  evidence_per_issue_max: 25
  rebuttal_rounds: 1
  extra_searches_per_counsel: 3
  jurors: 3
  # Counsel's evidence cut to 28,000 characters: the local 7B's 16k-token context (D-052).
  # Raise or remove it for a long-context model.
  max_evidence_chars: 28000
