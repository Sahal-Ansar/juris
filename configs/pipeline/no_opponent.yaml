# Ablation no_opponent (IDEA_final §5 "P-X", PLAN 7.12): juris_full with one role off or replaced
# by its passthrough. One counsel per issue (position A; labels are seeded at random), so no
# rebuttal.
name: no_opponent
description: "One counsel per issue (position A; labels are seeded at random), so no rebuttal."
kind: juris
seed: 0
stages:
  s0_issue_framing: "on"
  s1_research: "on"
  s2_opening: "on"
  s3_precedent: "on"
  s4_verify: "on"
  s5_rebuttal: "off"
  s6_cross_exam: "on"
  s7_verify: "on"
  s8_jury: "on"
  s9_judge: "on"
  s10_final_verify: "on"
params:
  max_issues: 4
  positions_per_issue: 2
  evidence_per_issue_min: 10
  evidence_per_issue_max: 25
  rebuttal_rounds: 1
  extra_searches_per_counsel: 3
  jurors: 3
  # Counsel's evidence cut to 28,000 characters: the local 7B's 16k-token context (D-052).
  # Raise or remove it for a long-context model.
  max_evidence_chars: 28000
  single_counsel: true
