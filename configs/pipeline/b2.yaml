# B2: compute-matched single agent (IDEA_final §5 and R1, PLAN 6.4; juris.baselines.b2).
# B1's draft, then critique -> revise rounds (the first critique also drives a second search)
# until the token budget is spent. Same model (BASELINE role), retriever, citation format and
# verifier as B1. The budget was an estimate of juris_full's tokens per case (D-045); PLAN 7.12
# measured both on dev with the local 7B: B2 159.0k vs juris_full 158.7k tokens per case (18
# items, ratio 1.00), so it stays (D-060). Re-check it whenever the model changes.
name: b2
description: B1 plus a second search and self-critique rounds, at Juris's token budget.
kind: b2
seed: 0
baseline:
  # The draft: as B1 (b1.yaml), so B2 differs from B1 only in what follows it.
  queries: llm
  max_queries: 5
  evidence_k: 20
  rerank: false
  repair_quotes: true
  # Critique -> revise rounds, while the estimated generation spend (prompt + output
  # characters / 4, every BASELINE call) is under target_tokens. With the verifier on top, B2
  # spends about what juris_full does (above).
  max_rounds: 8
  target_tokens: 170000
  # The second search, after the first critique: its queries, and how many new chunks it may
  # add (numbered after the first search's).
  follow_up_queries: 3
  follow_up_k: 8
  # Chunks shown to critique and revise (cited first, then new, then by rank): with the draft
  # in the prompt, more would not fit the local model's 16k context.
  revise_evidence_k: 12
