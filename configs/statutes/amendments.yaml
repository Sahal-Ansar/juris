# Hand-curated temporal validity per section (D-014). Every entry was checked against the
# official consolidated text on India Code (indiacode.gov.in), read manually, on the date given.
#
# Semantics: `in_force_from` is the first day the section's CURRENT text applies (the amendment's
# w.e.f. date); `in_force_to` is the last day a repealed section was in force (inclusive).
# Earlier versions of amended sections are not in the corpus text. Sections without an entry
# keep the Act's commencement and `amendments_curated: false`.
