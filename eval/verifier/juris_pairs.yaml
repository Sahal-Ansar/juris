- id: VP-047
  item: JE-051
  doc_id: SC-2022_19_212_241
  chunk_id: SC-2022_19_212_241#c0028
  pinpoint: '33'
  claim: A promise to pay a time-barred debt is enforceable under s. 25(3) only if it is supported by
    fresh consideration.
  quote: Promise to pay can be inferred on scrutinising the document. Only the promise should be clear
    and unconditional.
  passage: |-
    33. There is a distinction between acknowledgment under Section
    18 of the Limitation Act, 1963 and a promise within the meaning of
    Section 25 of the Contract Act. Both promise and acknowledgment in
    writing, signed by a party or its agent authorised in that behalf, have the
    1 AIR 1958 SC 328
    effect of creating a fresh starting of limitation. The difference is that an
    acknowledgment under Section 18 of the Limitation Act has to be made
    within the period of limitation and need not be accompanied by any
    promise to pay. If an acknowledgment shows existence of jural
    relationship, it may extend limitation even though there may be a denial
    to pay. On the other hand, Section 25(3) is only attracted when there is
    an express promise to pay a debt that is time barred or any part thereof.
    Promise to pay can be inferred on scrutinising the document. Only the
    promise should be clear and unconditional.
    34. The scheme of the IBC is to ensure that when a default takes
    place, in the sense that a debt becomes due and is not paid, the Corporate
    Insolvency Resolution Process begins. Where any corporate debtor
    commits default, a financial creditor, an operational creditor or the
    corporate debtor itself may initiate Corporate Insolvency Resolution
    Process in respect of such corporate debtor in the manner as provided
    in Chapter II of the IBC.
    35. The provisions of the IBC are designed to ensure that the
    business and/or commercial activities of the Corporate Debtor are
    continued by a Resolution Professional, post imposition of a moratorium,
    which would give the Corporate Debtor some reprieve from coercive
    litigation, which could drain the Corporate Debtor of its financial resources.
    This is to enable the Corporate Debtor to improve its financial health
    and at the same time repay the dues of its creditors.
  label: does_not_support
  construction: other
  rationale: The passage requires only a clear and unconditional express promise and says nothing about
    fresh consideration.
  reviewed_by: null
- id: VP-048
  item: JE-056
  doc_id: SC-1990_2_350_365
  chunk_id: SC-1990_2_350_365#c0003
  pinpoint: h-1
  claim: Where the terms of a contract are uncertain and the parties were not ad idem, specific performance
    cannot be granted.
  quote: If the stipulations and terms are uncertain and the parties are not ad idem there can be no specific
    performance, for there was no contract at all.
  passage: |-
    HELD: The specific performance of a contract is the actual execution of the contract according to its stipulations and terms, and the
    courts direct the party in default to do the very thing which he con·
    tracted to do. The stipulations and terms of the contract have, therefore,
    to be certain and the parties must have been consensus ad idem. The
    burden of showing the stipulations and terms of the contract and that
    the minds were ad idem is, of Course, on the plaintiff. If the stipulations
    and terms are uncertain and the parties are not ad idem there can be no
    specific performance, for there was no contract at all. [362D-E]
    Where there are negotiations, the Court has to determine at what
    point, if at all, the parties have reached agreement. Negotiations there-
    after would also be material if the agreement is rescinded. In the instant
    case the defence of there having not been a contract for lack of consensus
    ad idem was available to the defendant. [363F; 364B]
    The jurisdiction of the Court in specific performance is discre-tionary. When a promise is made in an alternative form and one
    alternative is impossible to perform, the question whether the promisoi
    is bound to perform the other or is altogether excused depends on the
    intention of the parties to be ascertained from the nature and terms of
    the contract and the circumstances of the particular case. [362F]
    The expression 'otherwise pay back the advance and compensation in the same amount' is capable of being interpreted as payment of the amount as alternative to performance. Of course the
    amount advanced and the compensation was stipulated to be the same
    amount. That, however, would not effect the real character of the
    promise. T36IG]
    CIVIL APPELLATE ruRISDICTION: Civil Appeal No. 4145 of
    1984.
  label: supports
  construction: gold
  rationale: The headnote states the rule in these terms.
  reviewed_by: null
- id: VP-049
  item: JE-056
  doc_id: SC-1990_2_350_365
  chunk_id: SC-1990_2_350_365#c0028
  pinpoint: p-18
  claim: Every contract is to be assumed specifically enforceable until the contrary is shown.
  quote: It may be suggested that from this it follows that a perfect system of jurisprudence ought to
    enforce the actual performance of contracts of evry kind and class
  passage: |-
    8
    '>-- Regarding the extent of the jurisdiction Fry wrote:
    ' y-
    "If a contract be made and one party to it make default in
    nerformance, there appears to result to the other party a
    right at his election either to insist on the actual performance of the contract, or to obtain satisfaction for the
    non-performance of it. It may be suggested that from this
    it follows that a perfect system of jurisprudence ought to
    enforce the actual performance of contracts of evry kind
    and class, except only when there are circumstances which
    render such enforcement unnecessary or inexpedient, and
    that it ought to be assumed that every contract is specifically enforceable until the contrary be shown. But so broad
    a proposition has never, it is believed, been asserted by any
    of the Judges of the Court of Chancery, or their successors
    in the High Court of Justice, though, if prophecy were the
    function of a law writer, it might be suggested that they will
    more and more approximate to such a rule."
    As Chitty observes, the "prophecy has not been whQUy fulfilled,
    for the scope of the remedy remains subject to many limitations." But
    the author observes a welcome move towards the more liberal view as
    to the extent of jurisdiction which was favoured by Lord Justice Fry.
    But where no contract has been entered into at all, there is no room for
    any liberal view.
    Section 9 of the Specific Relief Act says that except as otherwise
    provided in that Act where any relief is claimed under Chapter II of
    the Act in respect of a contract, the person against whom the relief is
    claimed may plead by way of defence any ground which is available to T him under any law relating to contracts. In the instant case the defence
    of there having not been a contract for lack of consensus ad idem was
    available to the defendant.
    In view of the above conclusion, the appeal has to be dismissed.
    We should, however, like before concluding, to refer to certain other
    aspects debated before us: .,.
  label: contradicts
  construction: argument_only
  rationale: Fry states the proposition only to say no Judge has asserted it, and the Court adds, via
    Chitty, that the remedy remains subject to many limitations.
  reviewed_by: null
- id: VP-050
  item: JE-056
  doc_id: SC-1990_2_350_365
  chunk_id: SC-1990_2_350_365#c0025
