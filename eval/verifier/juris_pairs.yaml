  claim: The word 'mistake' in s. 72 of the Contract Act covers a mistake of law as well as a mistake
    of fact.
  quote: There is no warrant for ascribing any limited meaning to the word ' mistake ' as has been used
    therein and it is wide enough to cover not only a mistake of fact but also a mistake of law.
  passage: |-
    W eo are of opinion that this interpretation put by Bhagwati J.
    their Lordships of the Privy Council on s. 72 is correct.
    There is no warrant for ascribing any limited meaning
    to the word ' mistake ' as has been used therein and it
    is wide enough to cover not only a mistake of fact but
    also a mistake of law. There is no conflict between
    the provisions of s. 72 on the one hand and ss. 21 and
    22 of the Indian Contract Act on the other and the
    true principle enunciated is that if one party under. a
    mistake, whether of fact or law, pays to another party
    money which is not due by contract or otherwise that
    money must be repaid. The mistake lies in thinking
    that the money paid was due when in fact it was not
    due and tha.t mistake, if established, entitles the party
    :uaying the money to recover it back from the party
    receiving the same.
