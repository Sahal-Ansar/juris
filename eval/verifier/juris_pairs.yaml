- id: VP-001
  item: JE-001
  doc_id: SC-1967_1_331_341
  chunk_id: SC-1967_1_331_341#c0010
  pinpoint: p-2
  claim: Under s. 16(3) of the Contract Act the burden of proving that a contract was not induced by undue
    influence lies on the person benefiting only where he is in a position to dominate the other's will
    and the transaction appears unconscionable.
  quote: Sub-section (3) of the section throws the burden of proving that a contract was not induced by
    undue influence on the person benefiting by it when two factors are found against him, namely that
    he is in a position to dominate the will of another and the transaction appears on the face of it
    or on the evidence adduced to he unconscionable.
  passage: |-
    Sub-section (2) of the section is illustrative as to when a person
    is to considered to be in a position to donlinate the will of another
    These are inter alia (a) where the donee holds a real or apparent
    authority over the donor or where he stands in a fiduciary relation
    to the donor or (b) where he makes a contract with a person whose
    mental capacity is temporarily or permanently affected by reason
    of age, illness, or mental or bodily distress.
    Sub-section (3) of the section throws the burden of proving
    that a contract was not induced by undue influence on the person
    benefiting by it when two factors are found against him, namely
    that he is in a position to dominate the will of another and the
    transaction appears on the face of it or on the evidence adduced
    to he unconscionable.
    SUBHAS CHANDRA v. GANGA PROSAD (Mitter, J.) 335
    The three stages for consideration of a case of undue influence
    were expounded in the case of Ragunath Prasad v. Sarju Prasad
    and others(l) in the following words :-
    "In the first place the relations between .the parties
    to each other must be such that one is in a position to
    dominate the will of the other. Once that position is
    substantiated the second stage has been reached-namely,
    the issue whether the contract has been induced by undue
    influence. Upon the determination of this issue a third
    point emerges, which is that of the onus probandi. If
    the transaction appears to be unconscionable, then the
    burden of proving that the contract was not .induced
    by undue influence is to lie upon the person who was. in
    a position to dominate the will of the other.
    Error is almost sure to arise if the order of these
    propositions be changed. The unconscionableness of the
    bargain is not the first thing to be considered. The first
    thing to be considered is the relations of these parties.
    Were they such as to put one in a position to dominate
    the will of the other?"
  label: supports
  construction: paraphrase
  rationale: The quoted sentence states both conditions (position to dominate, unconscionable transaction)
    that shift the burden under s. 16(3).
  reviewed_by: null
