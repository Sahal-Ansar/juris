- id: VP-041
  item: JE-041
  doc_id: SC-2021_11_120_141
  chunk_id: SC-2021_11_120_141#c0029
  pinpoint: '30'
  claim: Whether time is of the essence of a contract is decided from its express clause on time alone.
  quote: Merely having an explicit clause may not be sufficient to make time the essence of the contract.
  passage: |-
    30. It is now settled that 'whether time is of the essence in a
    contract', has to be culled out from the reading of the entire contract as
    well as the surrounding circumstances. Merely having an explicit clause
    may not be sufficient to make time the essence of the contract. As the
    contract was spread over a long tenure, the intention of the parties to
    provide for extensions surely reinforces the fact that timely performance
    was necessary. The fact that such extensions were granted indicates
    ONGC's effort to uphold the integrity of the contract instead of repudiating
    the same.
  label: contradicts
  construction: negated
  rationale: Para 30 says the question is culled from the entire contract and the surrounding circumstances,
    and an explicit clause may not be enough.
  reviewed_by: null
- id: VP-042
  item: JE-041
  doc_id: SC-2021_11_120_141
  chunk_id: SC-2021_11_120_141#c0034
  pinpoint: '33'
  claim: Once a promisee has waived liquidated damages, they can never be reimposed.
  quote: the promisee (ONGC) waived the liquidated damages initially and the same cannot be imposed, unless
    such imposition was clearly accepted by parties.
  passage: |-
    33. This brings us to the waiver.It may be noted that ONGC waived
    liquidated damages twice before giving extension with pre-estimated
    damages. The approach of the Arbitral Tribunal was to hold that once
    liquidated damages were waived in the first extension, subsequent
    extension could not be coupled with liquidated damages unless a clear
    intention flowed from the contract;while this Court recognizes the
    autonomy of the party to engage in contractual obligation. Such obligation
    must be contracted in clear terms. From the aforesaid discussion, it is
    clear that the promisee (ONGC) waived the liquidated damages initially
    and the same cannot be imposed, unless such imposition was clearly
    accepted by parties. In this case, the interpretation of the Arbitral Tribunal
    could not be faulted as being perverse, for the reasons stated above.
    34. Mr. Shyam Diwan, learned senior counsel, appearing on behalf
    of the Remi Metals, submitted that the view taken by the Arbitral Tribunal
    was reasonable, as the loss sustained by ONGC is given on the basis of
    actual loss. In this situation, the interpretation of the law and the facts
    provided under the award is a reasonable interpretation, which can be
    sustained as being a plausible view.
  label: partially_supports
  construction: dropped_condition
  rationale: Reimposition is barred unless the parties clearly accepted it; the claim drops the exception.
  reviewed_by: null
- id: VP-043
  item: JE-046
  doc_id: SC-2009_10_560_573
  chunk_id: SC-2009_10_560_573#c0018
  pinpoint: '20'
  claim: A proposer for insurance must disclose every fact that would influence a prudent insurer, whether
    or not he knew of it.
  quote: he is obliged to disclose it particularly while answering questions in the proposal form.
  passage: |-
    19. In this regard, it would be apposite to make a reference
    to Regulation 2(1)(d) of the Insurance Regulatory and
    Development Authority (Protection of Policyholders' Interests)
    ASSURANCE COMPANY LTD. [D.K. JAIN, J.]
    Regulations, 2002, which explains the meaning of term
    "material". The Regulation reads thus:
    "2. Definitions.-ln these regulations, unless the context
    otherwise requires,-
    (a) xxx xxx xxx
    (b) xxx xxx xxx
    (c) xxx xxx xxx
    (d) "Proposal Form" means a form to be filled in by
    the proposer for insurance, for furnishing all material
    information required by the insurer in respect of a risk, in
    order to enable the insurer to decide whether to accept or
    decHr:ie. to undertake the risk, and in the event of
    acceptance of the risk, to determine the rates, terms and
    conditions of a cover to be granted.
    Explanation: "Material" for the purpose of these
    regulations shall mean and include all important, essential
    and relevant information in the context of underwriting the
    risk to be covered by the insurer."
    Thus, the Regulation also defines the word "material" to mean
    and include all "important", "essential" and "relevant" information
    in the context of guiding the insurer to decide whether to
    undertake the risk or not.
    20. The upshot of the entire discussion is that in a Contract
    of Insurance, any fact which would influence the mind of a
    prudent insurer in deciding whether to accept or not to accept
    the risk is a "malarial fact". If the proposer has knowledge of
    ~ such fact, he is obliged to disclose it particularly while
    answering questions in the proposal form. Needless to
    emphasise that any inaccurate answer will entitle the insurer to
    repudiate his liability because there is clear presumption that
    any information sought for in the proposal form is material for
    the purpose of entering into a Contract of Insurance.
  label: partially_supports
  construction: dropped_condition
  rationale: The duty is stated for a fact of which the proposer has knowledge ("If the proposer has knowledge
    of such fact"); the claim drops the knowledge condition.
  reviewed_by: null
- id: VP-044
  item: JE-046
  doc_id: SC-2009_10_560_573
  chunk_id: SC-2009_10_560_573#c0017
  pinpoint: '17'
  claim: An insurer may repudiate a mediclaim policy only if the undisclosed fact caused the claim.
  quote: Any fact which goes to the root of the Contract of Insurance and has a bearing on the risk involved
    would be "material".
  passage: |-
    17. The term "material fact" is not defined in the Act and,
    therefore, it has been understood and explained by the Courts
    in general terms to mean as any fact which would influence the
    judgment of a prudent insurer in fixing the premium or
    determining whether he would like to accept the risk. Any fact
    which goes to the root of the Contract of Insurance and has a
    bearing on the risk involved would be "material".
    18. As stated in Pollock and Mufla's Indian Contract and
    Specific Relief Acts 'any fact the knowledge or ignorance of
    which would materially influence an insurer in making the
    contract or in estimating the degree and character of risks in
    fixing the rate of premium is a material fact.'
  label: does_not_support
  construction: other
  rationale: The passage defines a material fact; it says nothing about causation between the non-disclosure
    and the loss.
  reviewed_by: null
- id: VP-045
  item: JE-051
  doc_id: SC-2022_19_212_241
  chunk_id: SC-2022_19_212_241#c0027
  pinpoint: '31'
  claim: A written promise to pay a time-barred debt is a valid contract under s. 25(3) of the Contract
    Act.
  quote: A written promise to pay the barred debt is a valid contract.
  passage: |-
    29. From the above, it is clear that any agreement to pay a time
    barred debt, would be enforceable in law, within three years from the
    due date of payment, in terms of such agreement. It appears that Section
    25(3) of the Indian Contract Act was not brought to the notice of the
    NCLAT. The NCLAT also did not consider the aforesaid Section.
    30. In this appeal, it is contended that the last offer of 20th
    December, 2018 was followed by an agreement. Whether there was
    such agreement or not would have to be considered by the Adjudicating
    Authority. To invoke Section 25(3), the following conditions must be
    satisfied:-
    (i) It must refer to a debt, which the creditor, but for the period
    of limitation, might have enforced;
    (ii) There must be a distinct promise to pay such debt, fully or
    in part;
    (iii) The promise must be in writing, and signed by the debtor or
    his duly appointed agent.
    31. Under Section 25(3), a debtor can enter into an agreement in
    writing, to pay the whole or part of a debt, which the creditor might have
    enforced, but for the limitation of a suit in law. A written promise to pay
    the barred debt is a valid contract. Such a promise constitutes novation
    and can form the basis of a suit independent of the original debt, for it is
    well settled that the debt is not extinguished, the remedy gets barred by
    passage of time as held by this Court in Bombay Dyeing and
    Manufacturing Company Limited vs. State of Bombay1
    32. Section 25(3) applies only where the debt is one which would
    be enforceable against the defendants, but for the law of limitation. Where
    a debt is not binding on the defendant for other reasons, and
    consequentially not enforceable against him, there is no question of
    applicability of Section 25(3).
  label: supports
  construction: paraphrase
  rationale: Para 31 says so directly.
  reviewed_by: null
