    Under the terms of the agreements the amounts deposited by
    the plaintiff as security for due performance of the contracts
    were to stand forfeited in case the plaintiff neglected to perform
    his part of the contract. The High Court observed that the deposits so made may be regarded as earnest money. But that view
    cannot be accepted. According to Earl Jowitt in "The Dictionary of English Law" at p. 68'.l : "Giving an earnest or
    earnest-money is 'a mode of signifying assent to a contract of sale
    or the like, by giving to the vendor a nominal sum (e.g. a
    shilling) as a token that the parties are in earnest or have made
    up their minds." As observed by the Judicial Committee in
    Kun war Chiranjit Singh v. Har Swarup (') :
    "Earnest money is part of the purchase price when
    the transaction goes forward : it is forfeited when the
    transaction falls throug.1, by reason of the fault or failure
    of the vendee."
    In the present case the deposit was made not of a sum of monev
    by the purchaser to be applied towards part payment of the price
    when the contract was completed and till then as evidencing an
    intention on the part of the purchaser to buy property or goods.
    Here the plaintiff had deposited the amounts claimed as security
    for guaranteeing due performance of the contracts. Such deposits
    cannot be regarded as earnest money.
    Section 7 4 of the Contract Act provides :
    "When a contract has been broken, if a sum is
    named in the contract as the amount to be paid in case
