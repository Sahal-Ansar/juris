  chunk_id: SC-1969_1_620_623#c0007
  pinpoint: p-2
  claim: A surety's liability is immediate and is not deferred until the creditor has exhausted his remedies
    against the principal debtor.
  quote: The surety became thus liable to pay the entire amount. His liability was immediate. It was not
    deferred until the creditor exhausted his remedies against the principal debtor.
  passage: |-
    The demand for payment of the liability of the principal debtor was the only condition for the enforcement of the bond. That
    condition was fulfilled. Neither the principal debtor nor the
    surety discharged the admitted liability of the principal debtor in
    spite of dem.ands. Under sec. 128 of the Indian Contract Act,
    save as provided in the contract, the liability of the surety. is coextensive with that of the principal debtor. The surety became
    thus liable to pay the entire amount. His liability was immediate.
    It was not deferred until the creditor exhausted his remedies
    against the principal debtor.
    Before payment the surety has no right to dictate terms to the
    ~reditor an~ ask him to pnrsue his remedies against the principal
    m the first mstance. As Lord Eldon observed in Wright v.
    Simpson('). "But the surety is a guarantee; and it is his business
    to see whether the principal pays, and not that o[ the creditor."
    Tn the absence of some special equity the surety has no-right to
    restram an action against hin1 by the creditor on the ground that
    the principal is solvent or that the creditor may have relief against
    the principal in some other proceedings.
  label: supports
  construction: gold
  rationale: The passage says so in terms, relying on s. 128 of the Contract Act.
