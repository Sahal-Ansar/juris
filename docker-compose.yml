name: juris

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # HNSW index builds use parallel workers with shared memory; Docker's 64 MB default
    # /dev/shm fails them for the ~125k-vector corpus (PLAN 3.8).
    shm_size: 2gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juris}
      POSTGRES_DB: ${POSTGRES_DB:-juris}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
