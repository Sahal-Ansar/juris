# Alembic migrations for the Juris database (PLAN 3.6).
# The URL comes from juris.config (POSTGRES_* in .env) unless overridden:
#   uv run alembic upgrade head
#   uv run alembic -x url=postgresql+psycopg://user:pw@127.0.0.1:5432/other upgrade head
[alembic]
script_location = %(here)s/backend/juris/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
